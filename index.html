<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Diet &amp; Exercise Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="header">
    <h1>🥗 Diet &amp; Exercise</h1>
  </header>

  <!-- ---------------- LOG VIEW ---------------- -->
  <section id="logView" class="view">
    <div class="day-nav">
      <button id="prevDayBtn" class="nav-btn" aria-label="Previous day">‹</button>
      <div class="day-label">
        <div id="dayDate" class="day-date">Today</div>
        <input id="dayPicker" type="date" class="day-picker">
      </div>
      <button id="nextDayBtn" class="nav-btn" aria-label="Next day">›</button>
    </div>

    <div class="rating-card">
      <div class="rating-title">🍽️ Diet</div>
      <div class="rating-buttons" data-category="diet">
        <button class="rate-btn poor" data-value="poor">Poor</button>
        <button class="rate-btn neutral" data-value="neutral">Neutral</button>
        <button class="rate-btn good" data-value="good">Good</button>
      </div>
    </div>

    <div class="rating-card">
      <div class="rating-title">💪 Exercise</div>
      <div class="rating-buttons" data-category="exercise">
        <button class="rate-btn poor" data-value="poor">Poor</button>
        <button class="rate-btn neutral" data-value="neutral">Neutral</button>
        <button class="rate-btn good" data-value="good">Good</button>
      </div>
    </div>

    <button id="clearDayBtn" class="control-btn danger">🗑️ Clear This Day</button>
  </section>

  <!-- ---------------- WEEK VIEW ---------------- -->
  <section id="weekView" class="view hidden">
    <div class="day-nav">
      <button id="prevWeekBtn" class="nav-btn" aria-label="Previous week">‹</button>
      <div id="weekLabel" class="day-date">This Week</div>
      <button id="nextWeekBtn" class="nav-btn" aria-label="Next week">›</button>
    </div>

    <div id="weekDays" class="week-days"></div>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-title">🍽️ Diet</div>
        <div id="weekDietSummary" class="summary-body"></div>
      </div>
      <div class="summary-card">
        <div class="summary-title">💪 Exercise</div>
        <div id="weekExerciseSummary" class="summary-body"></div>
      </div>
    </div>
  </section>

  <!-- ---------------- MONTH VIEW ---------------- -->
  <section id="monthView" class="view hidden">
    <div class="day-nav">
      <button id="prevMonthBtn" class="nav-btn" aria-label="Previous month">‹</button>
      <div id="monthLabel" class="day-date">This Month</div>
      <button id="nextMonthBtn" class="nav-btn" aria-label="Next month">›</button>
    </div>

    <div class="month-legend">
      <span><i class="dot good"></i> Good</span>
      <span><i class="dot neutral"></i> Neutral</span>
      <span><i class="dot poor"></i> Poor</span>
      <span><i class="dot none"></i> No log</span>
    </div>

    <div id="monthWeekdayRow" class="month-weekday-row"></div>
    <div id="monthGrid" class="month-grid"></div>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-title">🍽️ Diet</div>
        <div id="monthDietSummary" class="summary-body"></div>
      </div>
      <div class="summary-card">
        <div class="summary-title">💪 Exercise</div>
        <div id="monthExerciseSummary" class="summary-body"></div>
      </div>
    </div>
  </section>

  <nav class="tab-bar">
    <button id="tabLog" class="tab-btn active" data-view="logView">📅 Log</button>
    <button id="tabWeek" class="tab-btn" data-view="weekView">🗓️ Week</button>
    <button id="tabMonth" class="tab-btn" data-view="monthView">📆 Month</button>
  </nav>

</div>

<script src="app.js"></script>
</body>
</html>
